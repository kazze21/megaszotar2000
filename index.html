    <script>

let words = JSON.parse(localStorage.getItem("words") || "[]");

let deck = [];
let current = null;

let currentDeHu = null;
let deckDeHu = [];

let hintLevel = 0;
let hintLevelDeHu = 0;

let verbs = [];
let verbDeck = [];
let currentVerb = null;

let verbStart = 0;
let verbEnd = 0;

document.getElementById("apiUrl").value =
localStorage.getItem("apiUrl") || "";

function levenshtein(a, b) {

    a = a.toLowerCase().trim();
    b = b.toLowerCase().trim();

    const matrix = [];

    for (let i = 0; i <= b.length; i++) {
        matrix[i] = [i];
    }

    for (let j = 0; j <= a.length; j++) {
        matrix[0][j] = j;
    }

    for (let i = 1; i <= b.length; i++) {

        for (let j = 1; j <= a.length; j++) {

            if (b.charAt(i - 1) === a.charAt(j - 1)) {

                matrix[i][j] = matrix[i - 1][j - 1];

            } else {

                matrix[i][j] = Math.min(
                    matrix[i - 1][j - 1] + 1,
                    matrix[i][j - 1] + 1,
                    matrix[i - 1][j] + 1
                );
            }
        }
    }

    return matrix[b.length][a.length];
}

function similarityPercent(a, b) {

    if (!a.length && !b.length) {
        return 100;
    }

    const distance = levenshtein(a, b);

    const maxLen = Math.max(
        a.length,
        b.length
    );

    return (
        (maxLen - distance) /
        maxLen
    ) * 100;
}


function saveUrl(){

    localStorage.setItem(
        "apiUrl",
        document.getElementById("apiUrl").value
    );

    alert("Mentve");
}

async function refreshWords(){

    const url =
        document.getElementById("apiUrl").value.trim();

    if(!url){
        alert("Adj meg API URL-t!");
        return;
    }

    try{

        console.log("API:", url);

        const response = await fetch(url);

        if(!response.ok){
            throw new Error(
                "HTTP error: " + response.status
            );
        }

        const loaded =
            await response.json();

        words = loaded;

         buildVerbList();

        localStorage.setItem(
            "words",
            JSON.stringify(words)
        );

        alert(
            words.length +
            " szó importálva"
        );

        updateRangeLimits();
        buildDeck();
        buildDeckDeHu();

    }catch(err){

        console.error(err);

        alert(
            "Nem sikerült letölteni:\n" +
            err.message
        );
    }
    
    verbs = words.filter(item =>
    item.verbHu &&
    item.praesens &&
    item.praeteritum &&
    item.perfekt
);
}

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j =
            Math.floor(
                Math.random()*(i+1)
            );

        [array[i],array[j]] =
        [array[j],array[i]];

    }

    return array;
}

function buildDeck(){

    deck = [];

    const range =
        getRangeIndexes();



    for(let i = range.start; i <= range.end; i++ )
    {
      deck.push(i);
    }

    if( document.getElementById("randomMode") .checked ){ shuffle(deck); } }

function buildDeckDeHu(){
      deckDeHu=[];

      const range=getRangeIndexes();

      for( let i=range.start; i<=range.end; i++ )
         { deckDeHu.push(i);
      }

      if( document.getElementById("randomMode") .checked ){ shuffle(deckDeHu); } }

function nextWord(){

    if(words.length === 0){

        document.getElementById("question")
            .innerText = "Nincs betöltött szótár";

        return;
    }

    if(deck.length === 0){
        buildDeck();
    }

    const idx = document.getElementById("randomMode").checked
    ? deck.pop()
    : deck.shift();

    if(idx === undefined){
        return;
    }

    const range = getRangeIndexes();

    document.getElementById("wordNumber")
        .innerText =
         "#" + (idx + 1) +
         "   [" +
         (range.start + 1) +
         "-" +
         (range.end + 1) +
         "]";

    current = words[idx];

    document.getElementById("question")
        .innerText = current.hu;

    document.getElementById("answer").value = "";
    document.getElementById("answer").className = "";
    const result =
    document.getElementById("result");

    result.innerText = "";
    result.className = "result";

    document.getElementById("answer").focus();
    
    hintLevel = 0;

   document.getElementById("hint")
       .innerText = "";
}

function nextWordDeHu(){

    if(words.length === 0){

        document.getElementById("questionDeHu")
            .innerText = "Nincs betöltött szótár";

        return;
    }

    if(deckDeHu.length === 0){
        buildDeckDeHu();
    }

      const idx = document.getElementById("randomMode").checked
          ? deckDeHu.pop()
          : deckDeHu.shift();

      if(idx === undefined){
          return;
      }

    const range = getRangeIndexes();

    document.getElementById("wordNumberDeHu")
        .innerText =
        "#" + (idx + 1) +
        "   [" +
        (range.start + 1) +
        "-" +
        (range.end + 1) +
        "]";

    currentDeHu = words[idx];

    document.getElementById("questionDeHu")
        .innerText = currentDeHu.de;

    document.getElementById("answerDeHu")
        .value = "";

    document.getElementById("answerDeHu")
        .className = "";

    const result =
    document.getElementById("resultDeHu");

    result.innerText = "";
    result.className = "result";

    document.getElementById("answerDeHu")
        .focus();
        
      hintLevelDeHu = 0;

      document.getElementById("hintDeHu")
          .innerText = "";

}


function checkAnswer(){

    if(!current)
        return;

    const input =
        document.getElementById("answer");

    const result =
        document.getElementById("result");

    const answer =
        input.value.trim();

    const correct =
        String(current.de || "").trim();

      const similarity =
          similarityPercent(
              answer,
              correct
          );

      let css = "wrong";

      if (similarity >= 100) {

          css = "correct";

      }
      else if (similarity >= 80) {

          css = "partial";

      }
      else {

          css = "wrong";

      }

    input.className = css;

    result.innerText = correct;
    result.className = "result " + css;
}

function checkAnswerDeHu(){

    if(!currentDeHu)
        return;

    const input =
        document.getElementById("answerDeHu");

    const result =
        document.getElementById("resultDeHu");

    const answer =
        input.value.trim();

    const correct =
        String(currentDeHu.hu || "").trim();

      const similarity =
          similarityPercent(
              answer,
              correct
          );

      let css = "wrong";

      if (similarity >= 100) {

          css = "correct";

      }
      else if (similarity >= 80) {

          css = "partial";

      }
      else {

          css = "wrong";

      }

    input.className = css;

    result.innerText = correct;
    result.className = "result " + css;
}

document

    .addEventListener(

        function(e){

            if(e.key === "Enter"){

            }

function showPage(pageId){ document .querySelectorAll(".menu button") .forEach(b=>b.classList.remove("active"));

   const settingsPanel =
    document.getElementById("practiceSettings");

   if(pageId === "verbs" || pageId === "settings"){

       settingsPanel.style.display = "none";

   }else{

       settingsPanel.style.display = "block";
   }

    document
        .querySelectorAll(".page")
        .forEach(page =>
            page.style.display = "none"
        );

    document
        .getElementById(pageId)
        .style.display = "block";

    const titles = {

        hu2de : "🇭🇺 → 🇩🇪",
        de2hu : "🇩🇪 → 🇭🇺",
        verbs : "📚 Múlt idő",
        settings : "⚙️ Beállítások"

    };

    document
        .getElementById("pageHeader")
        .innerText =
        titles[pageId];

    const buttonMap = {

        hu2de : "btnHu2De",
        de2hu : "btnDe2Hu",
        verbs : "btnVerbs",
        settings : "btnSettings"
    };

    document
        .getElementById(buttonMap[pageId])
        .classList.add("active");

    if(pageId === "hu2de"){
        nextWord();
    }

    if(pageId === "de2hu"){
        nextWordDeHu();
    }
    
    if(pageId === "verbs"){
         nextVerb();
    }
}

function getRangeIndexes(){

    let start =
        Number(
            document.getElementById("startRow").value
        ) - 1;

    let end =
        Number(
            document.getElementById("endRow").value
        ) - 1;

    if(start < 0){
        start = 0;
    }

    if(end >= words.length){
        end = words.length - 1;
    }

    return {
        start,
        end
    };
}

function updateRangeLimits(){

    if(words.length === 0)
        return;

    const minId = 1;
    const maxId = words.length;

    const startInput =
        document.getElementById("startRow");

    const endInput =
        document.getElementById("endRow");

    startInput.min = minId;
    startInput.max = maxId;

    endInput.min = minId;
    endInput.max = maxId;

    startInput.value = minId;
    endInput.value = maxId;
}

function validateRange(){

    const maxId = words.length;

    let start =
        Number(
            document.getElementById("startRow").value
        );

    let end =
        Number(
            document.getElementById("endRow").value
        );

    start = Math.max(1, start);
    start = Math.min(maxId, start);

    end = Math.max(1, end);
    end = Math.min(maxId, end);

    if(start > end){

        end = start;
    }

    document.getElementById("startRow").value =
        start;

    document.getElementById("endRow").value =
        end;
        
    deck = [];
    deckDeHu = [];
}

function modeChanged(){

    deck = [];
    deckDeHu = [];

}

function giveHint(){

    if(!current)
        return;

    const correct =
        String(current.de || "");

    if(hintLevel < correct.length){
        hintLevel++;
    }

    let hint = "";

    for(let i = 0; i < correct.length; i++){

        if(correct[i] === " "){
            hint += " ";
        }
        else if(i < hintLevel){
            hint += correct[i];
        }
        else{
            hint += "*";
        }

    }

    document.getElementById("hint").innerText = hint;
}

function giveHintDeHu(){

    if(!currentDeHu)
        return;

    const correct =
        String(currentDeHu.hu || "");

    if(hintLevelDeHu < correct.length){
        hintLevelDeHu++;
    }

    let hint = "";

    for(let i = 0; i < correct.length; i++){

        if(correct[i] === " "){
            hint += " ";
        }
        else if(i < hintLevelDeHu){
            hint += correct[i];
        }
        else{
            hint += "*";
        }

    }

    document.getElementById("hintDeHu")
        .innerText = hint;
}

if(words.length > 0){

    buildVerbList();
      
    updateRangeLimits();

    buildDeck();
    buildDeckDeHu();

    nextWord();
}

function buildVerbDeck(){

    verbDeck = [];

    const range =
        getVerbRange();

    for(
        let i = range.start;
        i <= range.end;
        i++
    ){
        verbDeck.push(i);
    }

    if(
        document.getElementById("verbRandomMode")
        .checked
    ){
        shuffle(verbDeck);
    }
}

function nextVerb(){

    if(verbs.length === 0){
        return;
    }

    if(verbDeck.length === 0){
        buildVerbDeck();
    }

    const idx =
        document.getElementById("verbRandomMode").checked
        ? verbDeck.pop()
        : verbDeck.shift();

    currentVerb = verbs[idx];
    
    document.getElementById("verbNumber")
    .innerText =
    "#" + (idx + 1) +
    " [" +
    (Number(document.getElementById("verbStartRow").value)) +
    "-" +
    (Number(document.getElementById("verbEndRow").value)) +
    "]";

    document.getElementById("verbQuestion")
        .innerText =
        currentVerb.verbHu;

    document.getElementById("verbPraesens").value = "";
    document.getElementById("verbPraeteritum").value = "";
    document.getElementById("verbPerfekt").value = "";
              
      document.getElementById("verbPraesens").className = "";
      document.getElementById("verbPraeteritum").className = "";
      document.getElementById("verbPerfekt").className = "";

      document.getElementById("verbPraesensResult").innerText = "";
      document.getElementById("verbPraeteritumResult").innerText = "";
      document.getElementById("verbPerfektResult").innerText = "";
}

function checkVerb(){

    checkVerbField(
        "verbPraesens",
        "verbPraesensResult",
        currentVerb.praesens
    );

    checkVerbField(
        "verbPraeteritum",
        "verbPraeteritumResult",
        currentVerb.praeteritum
    );

    checkVerbField(
        "verbPerfekt",
        "verbPerfektResult",
        currentVerb.perfekt
    );
}

[
    "verbPraesens",
    "verbPraeteritum",
    "verbPerfekt"
].forEach(id => {

    document
        .getElementById(id)
        .addEventListener("keydown", function(e){

         if(e.key === "Enter"){

             if(
                 document.getElementById("verbPraesens").value.trim() !== "" &&
                 document.getElementById("verbPraeteritum").value.trim() !== "" &&
                 document.getElementById("verbPerfekt").value.trim() !== ""
             ){
                 checkVerb();
             }

         }

        });

});

function checkVerbField(
    inputId,
    resultId,
    correctAnswer
){

    const input =
        document.getElementById(inputId);

    const result =
        document.getElementById(resultId);

    const answer =
        input.value.trim();

    const correct =
        String(correctAnswer).trim();

      const similarity =
          similarityPercent(
              answer,
              correct
          );

      let css = "wrong";

      if (similarity >= 100) {

          css = "correct";

      }
      else if (similarity >= 80) {

          css = "partial";

      }
      else {

          css = "wrong";

      }

    input.className = css;
    
    result.innerText =
    css === "wrong"
        ? correct
        : "";
}

function buildVerbList(){

    verbs = words.filter(item =>
        item.verbHu &&
        item.praesens &&
        item.praeteritum &&
        item.perfekt
    );
    
    document.getElementById("verbStartRow").value = 1;
    document.getElementById("verbEndRow").value = verbs.length;
}

function getVerbRange(){

    let start =
        Number(
            document.getElementById("verbStartRow").value
        ) - 1;

    let end =
        Number(
            document.getElementById("verbEndRow").value
        ) - 1;

    if(start < 0){
        start = 0;
    }

    if(end >= verbs.length){
        end = verbs.length - 1;
    }

    if(start > end){
        start = end;
    }

    return {
        start,
        end
    };
}

function jumpToHu2De() {

    let id = Number(
        document.getElementById("jumpIdHu2De").value
    );

    if (id < 1 || id > words.length) {
        return;
    }

    current = words[id - 1];

    document.getElementById("wordNumber").innerText =
        "#" + id;

    document.getElementById("question").innerText =
        current.hu;

    document.getElementById("answer").value = "";
    document.getElementById("answer").className = "";
    document.getElementById("result").innerText = "";
    document.getElementById("hint").innerText = "";

    hintLevel = 0;

    document.getElementById("answer").focus();
}
